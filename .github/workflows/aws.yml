name: Publicar en AWS

# solo cuando el cambio ya esta en staging, nunca en los pull request
on:
  push:
    branches: [staging]
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_KEY: ${{ secrets.EC2_KEY }}
    steps:
      - name: Bajar el repositorio
        uses: actions/checkout@v4

      - name: Instalar node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: KiwiExpress/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: KiwiExpress

      # en la ec2 la app va en la raiz y el api esta en la misma ip en el puerto 8080
      - name: Construir el proyecto
        run: npm run build
        working-directory: KiwiExpress
        env:
          VITE_BASE: /
          VITE_API_URL: http://${{ secrets.EC2_HOST }}:8080/api/v1

      # borra la version de antes y levanta un nginx con la nueva en el puerto 80
      - name: Subir a la ec2
        run: |
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_KEY" ]; then
            echo "faltan los secrets EC2_HOST o EC2_KEY, no se publica (ver el readme)"
            exit 0
          fi
          echo "$EC2_KEY" > llave.pem
          chmod 600 llave.pem
          ssh -i llave.pem -o StrictHostKeyChecking=no ec2-user@$EC2_HOST "rm -rf /home/ec2-user/front"
          scp -r -i llave.pem -o StrictHostKeyChecking=no KiwiExpress/dist ec2-user@$EC2_HOST:/home/ec2-user/front
          ssh -i llave.pem -o StrictHostKeyChecking=no ec2-user@$EC2_HOST "docker rm -f kiwi-front 2>/dev/null; docker run -d --name kiwi-front --restart unless-stopped -p 80:80 -v /home/ec2-user/front:/usr/share/nginx/html:ro nginx:alpine"
          rm llave.pem
