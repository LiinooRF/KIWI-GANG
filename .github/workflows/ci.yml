name: Revisar los pull request

# corre en cada pull request hacia staging y tambien al subir a staging
on:
  pull_request:
    branches: [staging]
  push:
    branches: [staging]

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el repositorio
        uses: actions/checkout@v4

      - name: Instalar node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: KiwiExpress/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: KiwiExpress

      - name: Revisar que el proyecto compile
        run: npm run build
        working-directory: KiwiExpress

      - name: Correr las pruebas unitarias con cobertura
        run: npm test
        working-directory: KiwiExpress
        env:
          # con esto karma usa el launcher con --no-sandbox, si no chrome no parte en el runner
          CI: true

      - name: Guardar el reporte de cobertura
        # se guarda aunque las pruebas fallen, asi podemos revisar que paso
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-${{ github.run_number }}
          path: KiwiExpress/coverage/
          retention-days: 30

      - name: Mostrar la cobertura en el resumen
        if: always()
        run: |
          echo "## Cobertura de las pruebas" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat KiwiExpress/coverage/cobertura.txt >> $GITHUB_STEP_SUMMARY || echo "no se genero el reporte" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
